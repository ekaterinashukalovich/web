<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="543x543" href="img/favicon.png">
        <title>Список студентов</title>
    </head>
    <body>
        <header>
            <h1>Список студентов</h1>
        </header>

        <main>
            <div class="actions">
                <button id="addStudentBtn" class="btn btn-add">Добавить студента</button>
            </div>

            <table id="studentsTable">
                <thead>
                <tr>
                    <th>ФИО</th>
                    <th>Группа</th>
                    <th>ИСУ ID</th>
                    <th>Общежитие</th>
                    <th>Комната</th>
                    <th>Дата заселения</th>
                    <th>Иностранец</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody id="studentsTableBody">
                </tbody>
            </table>

            <p id="emptyMessage" class="empty-message">Студенты не добавлены. Нажмите "Добавить студента".</p>
        </main>

        <script src="js/cookies.js" defer></script>
        <script src="js/script.js" defer></script>
        <script src="js/app.js" defer></script>
        <link rel="stylesheet" href="css/style.css">
    </body>
</html>
