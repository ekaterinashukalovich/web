<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" sizes="543x543" href="img/favicon.png">
        <title></title>
    </head>
    <body>
        <main>
            <button class="btn btn-back" id="backBtn">← Назад к списку</button>

            <div class="dossier-container">
                <h1 class="dossier-title" id="dossierTitle">ФИО студента</h1>

                <div class="dossier-info">
                    <div class="dossier-field">
                        <label>Фамилия</label>
                        <div class="value" id="dossierSurname">—</div>
                    </div>

                    <div class="dossier-field">
                        <label>Имя</label>
                        <div class="value" id="dossierName">—</div>
                    </div>

                    <div class="dossier-field">
                        <label>Отчество</label>
                        <div class="value" id="dossierPatronymic">—</div>
                    </div>

                    <div class="dossier-field">
                        <label>Учебная группа</label>
                        <div class="value" id="dossierGroup">—</div>
                    </div>

                    <div class="dossier-field">
                        <label>ИСУ ID</label>
                        <div class="value" id="dossierIsu">—</div>
                    </div>

                    <div class="dossier-field">
                        <label>Общежитие</label>
                        <div class="value" id="dossierDormitory">—</div>
                    </div>

                    <div class="dossier-field">
                        <label>Номер комнаты</label>
                        <div class="value" id="dossierRoomnum">—</div>
                    </div>

                    <div class="dossier-field">
                        <label>Дата заселения</label>
                        <div class="value" id="dossierDate">—</div>
                    </div>

                    <div class="dossier-field">
                        <label>Студент-иностранец</label>
                        <div class="value" id="dossierForeign">—</div>
                    </div>

                    <div class="dossier-field full-width">
                        <label>Заметки</label>
                        <div class="value" id="dossierNotes">—</div>
                    </div>
                </div>

                <div class="dossier-actions">
                    <button class="btn btn-edit" id="editBtn">Редактировать</button>
                </div>
            </div>
        </main>

    <script src="js/cookies.js" defer></script>
    <script src="js/app.js" defer></script>
    </body>
</html>
